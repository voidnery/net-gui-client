name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # go.mod и go.sum должны соответствовать реальным импортам.
      # Если tidy что-то изменил — сборка падает: значит зависимости не зафиксированы.
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      # go vet — статический анализ поверх компилятора.
      # Ловит валидный, но подозрительный код. DoD, пункт 4.
      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...
