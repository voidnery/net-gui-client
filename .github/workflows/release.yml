name: Release

# Автоматическая простановка тега версии при пуше и выпуск релиза.
#
# Как это работает:
#   • версия хранится в файле VERSION в корне репозитория;
#   • пуш в master → тег vX.Y.Z, обычный релиз;
#   • пуш в beta   → тег vX.Y.Z-beta.<номер сборки>, пред-релиз;
#   • если тег уже существует, задание завершается без действий —
#     то есть обычные пуши без изменения VERSION ничего не выпускают.
#
# Теги подписываются и получают на GitHub отметку «Verified».
# Поддерживаются два способа подписи, выбор автоматический:
#
#   1. SSH-ключ  — секрет SSH_SIGNING_KEY   (рекомендуется, проще)
#   2. GPG-ключ  — секреты GPG_PRIVATE_KEY и GPG_PASSPHRASE
#
# Если не задано ни одного, тег всё равно создаётся — без подписи и с
# предупреждением в журнале. Репозиторий работоспособен до настройки ключа.
#
# Настройка ключей и секретов — docs/github-setup.md, шаг 6.

on:
  push:
    branches: [master, beta]

permissions:
  contents: write

jobs:
  tag:
    name: Проставить тег версии
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      created: ${{ steps.create.outputs.created }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # нужна полная история и все теги

      - name: Определить имя тега
        id: plan
        run: |
          set -euo pipefail
          if [ ! -f VERSION ]; then
            echo "::error::Файл VERSION не найден в корне репозитория"
            exit 1
          fi
          VER="$(tr -d ' \t\r\n' < VERSION)"
          if ! printf '%s' "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION должен быть вида X.Y.Z, а получено: '$VER'"
            exit 1
          fi
          if [ "${GITHUB_REF_NAME}" = "beta" ]; then
            echo "tag=v${VER}-beta.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Создать и запушить подписанный тег
        id: create
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          SSH_SIGNING_KEY: ${{ secrets.SSH_SIGNING_KEY }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SIGNER_NAME: ${{ vars.SIGNER_NAME }}
          SIGNER_EMAIL: ${{ vars.SIGNER_EMAIL }}
        run: |
          set -euo pipefail

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Тег ${TAG} уже существует — выпуск пропущен."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name  "${SIGNER_NAME:-github-actions[bot]}"
          git config user.email "${SIGNER_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"

          if [ -n "${SSH_SIGNING_KEY}" ]; then
            # --- Способ 1: подпись SSH-ключом (рекомендуется) ---------------
            echo "Подписываю тег ${TAG} SSH-ключом"
            install -d -m 700 ~/.ssh
            printf '%s\n' "${SSH_SIGNING_KEY}" > ~/.ssh/tag_signing_key
            chmod 600 ~/.ssh/tag_signing_key

            git config gpg.format ssh
            git config user.signingkey ~/.ssh/tag_signing_key
            git tag -s "${TAG}" -m "Release ${TAG}"

            shred -u ~/.ssh/tag_signing_key 2>/dev/null || rm -f ~/.ssh/tag_signing_key

          elif [ -n "${GPG_PRIVATE_KEY}" ]; then
            # --- Способ 2: подпись GPG-ключом --------------------------------
            mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
            echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
            echo "pinentry-mode loopback"  >> ~/.gnupg/gpg.conf
            gpgconf --kill gpg-agent || true

            printf '%s\n' "${GPG_PRIVATE_KEY}" | gpg --batch --quiet --import
            KEY_ID="$(gpg --list-secret-keys --with-colons \
                      | awk -F: '/^sec:/ { print $5; exit }')"

            echo "Подписываю тег ${TAG} GPG-ключом ${KEY_ID}"
            git config user.signingkey "${KEY_ID}"
            git config gpg.program gpg
            gpg --batch --pinentry-mode loopback \
                --passphrase "${GPG_PASSPHRASE}" \
                --sign --output /dev/null /dev/null 2>/dev/null || true
            git tag -s "${TAG}" -m "Release ${TAG}"

          else
            echo "::warning::Ключ подписи не настроен — тег создаётся БЕЗ подписи. Задайте секрет SSH_SIGNING_KEY, см. docs/github-setup.md, шаг 6."
            git tag -a "${TAG}" -m "Release ${TAG}"
          fi

          git push origin "refs/tags/${TAG}"
          echo "created=true" >> "$GITHUB_OUTPUT"

  release:
    name: Собрать и опубликовать релиз
    needs: tag
    if: needs.tag.outputs.created == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Сборка
        shell: bash
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          VER="${TAG#v}"
          for pkg in ./cmd/net-cli; do
            name="$(basename "$pkg")"
            go build -trimpath \
              -ldflags "-s -w -X main.Version=${VER}" \
              -o "dist/${name}.exe" "$pkg"
          done
          ls -la dist

      - name: Контрольные суммы
        shell: bash
        run: |
          cd dist
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          prerelease: ${{ needs.tag.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
