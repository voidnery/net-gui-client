name: CI

# Ветки проекта — master и beta (docs/github-setup.md).
# Здесь были main и dev: файл написан до выбора схемы веток, из-за чего
# CI не запускался ни разу. Обнаружено при проверке первого пуша.
on:
  push:
    branches: [master, beta]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # go.mod и go.sum должны соответствовать реальным импортам.
      # Если tidy что-то изменил — сборка падает: значит зависимости не зафиксированы.
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      # go vet — статический анализ поверх компилятора.
      # Ловит валидный, но подозрительный код. DoD, пункт 4.
      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # Детектор гонок требует cgo, а значит и компилятора C.
      # На раннере windows-latest mingw-w64 предустановлен, поэтому здесь
      # проверка работает. На машине разработчика без компилятора C
      # `go test -race` завершится ошибкой «-race requires cgo» —
      # это ожидаемо, локально достаточно обычного `go test ./...`.
      - name: Test with race detector
        env:
          CGO_ENABLED: '1'
        run: go test -race ./...
